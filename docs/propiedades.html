  <style>
    /* Misma paleta que el inicio (video de presentación): crema, verde y dorado. */
    :root {
      --crema: #ebe5dd;
      --crema-clara: #f6f2ec;
      --panel: rgba(255, 255, 255, 0.78);
      --borde: rgba(28, 74, 44, 0.14);
      --tinta: #24322a;
      --tenue: #6d7469;
      --verde: #1c4a2c;
      --verde-claro: #2f6b42;
      --rojo: #a3322a;
      --oro: #a87a2f;
      --titulos: "Cinzel", "Times New Roman", serif;
      --texto: "Manrope", "Segoe UI", system-ui, sans-serif;
      --datos: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --campo: #fffdfa;
      --campo-borde: var(--campo-borde);
      --linea: var(--linea);
      --sobre-verde: #fffaf0;
      --boton-1: #2f6b42;
      --boton-2: #1c4a2c;
      --pestanas-fondo: rgba(255, 255, 255, 0.55);
      --alerta-texto: #7a5a22;
      --alerta-fuerte: #5e4416;
      --alerta-fondo: rgba(217, 180, 106, 0.14);
      --lat-ancho: 248px;
      --lat-fondo-1: #173d27;
      --lat-fondo-2: #1e4a31;
      --lat-texto: rgba(250, 247, 241, 0.94);
      --lat-tenue: rgba(250, 247, 241, 0.62);
      --lat-linea: rgba(246, 242, 236, 0.10);
      color-scheme: light;
    }
    /* Modo oscuro (botón del menú; se recuerda en este navegador) */
    :root[data-modo="oscuro"] {
      --crema: #0e1712;
      --crema-clara: #18261e;
      --panel: rgba(20, 32, 25, 0.94);
      --borde: #26382d;
      --tinta: #ece7dd;
      --tenue: #a9b0a3;
      --verde: #8cc79f;
      --verde-claro: #7fbf93;
      --rojo: #e57b70;
      --oro: #d9b46a;
      --campo: #142019;
      --campo-borde: #34493b;
      --linea: rgba(255, 255, 255, 0.06);
      --boton-1: #4f9a69;
      --boton-2: #2f6b42;
      --pestanas-fondo: rgba(255, 255, 255, 0.04);
      --alerta-texto: #e2c27e;
      --alerta-fuerte: #f0d59a;
      --alerta-fondo: rgba(217, 180, 106, 0.12);
      --lat-fondo-1: #0c1f14;
      --lat-fondo-2: #11291b;
      color-scheme: dark;
    }
    :root[data-modo="oscuro"] .kpi, :root[data-modo="oscuro"] .panel { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
    :root[data-modo="oscuro"] .pill.amoblado { color: #9db8ea; background: rgba(142, 170, 219, 0.16); }
    :root[data-modo="oscuro"] .celda-mes.transfiere { color: #a6dbb6; }
    :root[data-modo="oscuro"] .celda-mes.efectivo { color: #e8cd94; }
    :root[data-modo="oscuro"] .celda-mes.atraso { color: #f0b47e; }
    :root[data-modo="oscuro"] .celda-mes { border-color: var(--crema-clara); }
    :root[data-modo="oscuro"] .marca-color { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
    * { box-sizing: border-box; }
    body.verificando .pagina { visibility: hidden; }
    .usuario { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 13px; color: var(--tenue); }
    .usuario button { font: inherit; font-weight: 600; color: var(--oro); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--texto); color: var(--tinta);
      background: radial-gradient(120% 70% at 50% 0%, var(--crema-clara), var(--crema) 60%) fixed, var(--crema);
    }
    .pagina { width: min(1180px, 100%); margin: 0 auto; padding: 20px 16px 48px; }
    /* ---------- Menú lateral (en el celular, arriba y con las secciones deslizables) ---------- */
    .lateral { background: linear-gradient(180deg, var(--lat-fondo-1), var(--lat-fondo-2)); color: var(--lat-texto); padding: 12px 16px; }
    .lat-marca { display: flex; align-items: center; gap: 12px; margin: 0; }
    .lat-marca img { width: 40px; height: 40px; border-radius: 50%; background: #f6f2ec; padding: 2px; flex-shrink: 0; }
    .lat-marca b { display: block; font-family: var(--titulos); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; color: #fffaf0; }
    .lat-marca .seccion { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: #d9b46a; margin-top: 3px; }
    .lat-grupo { display: none; }
    .lat-nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px; }
    .lat-nav::-webkit-scrollbar { display: none; }
    .lat-item { display: flex; align-items: center; gap: 10px; flex-shrink: 0; font: 600 13.5px/1 var(--texto); color: var(--lat-tenue); background: none; border: 0; border-radius: 10px;
      padding: 10px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; position: relative; }
    .lat-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.9; }
    .lat-item:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
    .lat-item.activa { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .lat-item:focus-visible { outline: 2px solid #d9b46a; outline-offset: -2px; }
    .lat-item:disabled { opacity: 0.4; cursor: default; }
    .lat-pie { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--lat-linea); }
    .lat-pie .lat-item { padding: 8px 10px; font-size: 13px; }
    .lat-quien { font-size: 12.5px; color: var(--lat-tenue); padding: 0 10px; flex: 1 1 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (min-width: 960px) {
      body { padding-left: var(--lat-ancho); }
      .lateral { position: fixed; left: 0; top: 0; bottom: 0; width: var(--lat-ancho); z-index: 40; display: flex; flex-direction: column; padding: 18px 12px 14px;
        box-shadow: inset -1px 0 0 var(--lat-linea); overflow-y: auto; }
      .lat-marca { padding: 0 6px 16px; border-bottom: 1px solid var(--lat-linea); }
      .lat-grupo { display: block; padding: 16px 12px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lat-tenue); }
      .lat-nav { flex-direction: column; gap: 2px; overflow: visible; margin: 0; padding: 0; }
      .lat-item { width: 100%; }
      .lat-item.activa::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #d9b46a; }
      .lat-pie { margin-top: auto; flex-direction: column; align-items: stretch; gap: 2px; padding-top: 12px; }
      .lat-quien { flex: none; padding: 4px 12px 8px; }
      /* Unidades: el menú queda solo con íconos (la tabla usa ese lugar) y se despliega encima al pasar el mouse. */
      body.ancho { padding-left: 72px; }
      body.ancho .lateral { width: 72px; overflow-x: hidden; transition: width 0.18s ease, box-shadow 0.18s ease; }
      body.ancho .lateral:hover, body.ancho .lateral:has(:focus-visible) { width: var(--lat-ancho); box-shadow: 12px 0 32px -18px rgba(0, 0, 0, 0.55); }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-marca span,
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-quien { display: none; }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-grupo { font-size: 0; padding: 10px 0 4px; margin: 0 8px; border-bottom: 1px solid var(--lat-linea); }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-item { font-size: 0; justify-content: center; padding: 10px 0; gap: 0; }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-item span { display: none; }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-item svg { width: 20px; height: 20px; }
      body.ancho .lateral:not(:hover):not(:has(:focus-visible)) .lat-marca { justify-content: center; padding: 0 0 16px; }
    }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .volver { color: var(--verde); text-decoration: none; font-size: 14px; font-weight: 600; }
    .volver:hover { color: var(--oro); }
    .marca { margin: 0; display: flex; align-items: center; gap: 14px; }
    .marca img { width: 64px; height: 64px; }
    .marca b { display: block; font-family: var(--titulos); font-weight: 600; font-size: clamp(20px, 3vw, 28px); letter-spacing: 0.08em; color: var(--verde); }
    .marca .seccion { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--oro); margin-top: 4px; }
    .aviso { font-size: 13px; color: var(--alerta-texto); border: 1px solid rgba(184, 137, 58, 0.4); background: var(--alerta-fondo); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .kpi, .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; box-shadow: 0 18px 36px -28px rgba(28, 74, 44, 0.5); }
    .kpi { padding: 16px 18px; }
    .kpi small { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
    .kpi b { display: block; margin-top: 6px; font-family: var(--datos); font-size: 22px; font-weight: 500; color: var(--verde); }
    .kpi span { display: block; margin-top: 4px; font-size: 12.5px; color: var(--tenue); }

    .grilla { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; }
    @media (max-width: 860px) { .grilla { grid-template-columns: minmax(0, 1fr); } }
    .panel { padding: 18px; min-width: 0; }
    .panel h2 { margin: 0 0 12px; font-family: var(--titulos); font-weight: 600; font-size: 18px; letter-spacing: 0.08em; color: var(--verde); }
    .herramientas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .herramientas input, .herramientas select {
      font: inherit; font-size: 14px; color: var(--tinta); background: var(--campo);
      border: 1px solid var(--campo-borde); border-radius: 10px; padding: 8px 12px; min-width: 0;
    }
    .herramientas input:focus, .herramientas select:focus { outline: none; border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184, 137, 58, 0.18); }
    .herramientas input { flex: 1 1 200px; }
    .tabla-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
    td.num, th.num { text-align: right; font-family: var(--datos); white-space: nowrap; }
    .sub { display: block; font-size: 12.5px; color: var(--tenue); }
    .vacio { color: var(--tenue); padding: 16px 10px; }

    /* ---------- Liquidación mensual ---------- */
    .barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .barra h2 { margin: 0; font-family: var(--titulos); font-weight: 600; font-size: clamp(20px, 2.6vw, 26px); letter-spacing: 0.06em; color: var(--verde); }
    .barra .sub { margin-top: 2px; }
    .barra-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .barra-acciones select {
      font: inherit; font-size: 14px; color: var(--tinta); background: var(--campo);
      border: 1px solid var(--campo-borde); border-radius: 10px; padding: 8px 12px;
    }
    .boton { font: 700 14px/1 var(--texto); letter-spacing: 0.03em; color: var(--sobre-verde); cursor: pointer; padding: 11px 16px; border-radius: 10px; border: 0;
      background: linear-gradient(180deg, var(--boton-1), var(--boton-2)); box-shadow: 0 10px 22px -14px rgba(28, 74, 44, 0.8); }
    .boton:hover:not(:disabled) { filter: brightness(1.08); }
    .boton:disabled { opacity: 0.6; cursor: wait; }
    .boton.secundario { color: var(--verde); background: var(--campo); border: 1px solid var(--campo-borde); box-shadow: none; }
    .boton:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
    .alertas { display: grid; gap: 8px; margin-bottom: 20px; }
    .alerta { font-size: 13.5px; color: var(--alerta-texto); border: 1px solid rgba(184, 137, 58, 0.4); background: var(--alerta-fondo); border-radius: 12px; padding: 10px 14px; }
    .alerta b { color: var(--alerta-fuerte); }
    .alerta.error { color: var(--rojo); border-color: rgba(163, 50, 42, 0.35); background: rgba(163, 50, 42, 0.07); }
    .seccion-grilla { margin-bottom: 18px; }
    .grilla.mitad { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    @media (max-width: 860px) { .grilla.mitad { grid-template-columns: minmax(0, 1fr); } }
    .columna { display: grid; gap: 18px; align-content: start; min-width: 0; }
    td.unidad { min-width: 190px; }
    .panel .sub, .sub-panel { font-size: 12.5px; color: var(--tenue); margin: -6px 0 12px; }
    tfoot td { font-weight: 700; border-top: 2px solid var(--borde); border-bottom: 0; color: var(--verde); }
    td.cero { color: var(--tenue); }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    .pill.transfiere { color: var(--verde-claro); background: rgba(47, 107, 66, 0.12); }
    .pill.efectivo { color: var(--oro); background: rgba(217, 180, 106, 0.2); }
    .pill.no-abono { color: var(--rojo); background: rgba(163, 50, 42, 0.1); }
    .pill.desocupado { color: var(--tenue); background: rgba(109, 116, 105, 0.14); }
    .pill.amoblado { color: #3b5b99; background: rgba(142, 170, 219, 0.25); }
    .marca-color { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
    .liq { list-style: none; margin: 0; padding: 0; }
    .liq li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
    .liq li .m { font-family: var(--datos); white-space: nowrap; }
    .liq li.descuento { color: var(--tenue); padding-left: 14px; }
    .liq li.descuento .m::before { content: "− "; }
    .liq li.total { font-weight: 700; color: var(--verde); border-bottom: 2px solid var(--borde); }
    .liq li.total.final { font-size: 16px; border-bottom: 0; }
    .recibo { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--crema-clara); border: 1px dashed rgba(28, 74, 44, 0.25); font-size: 13.5px; }
    .recibo .firma { margin-top: 18px; padding-top: 8px; border-top: 1px solid rgba(28, 74, 44, 0.35); width: min(260px, 100%); font-weight: 700; color: var(--verde); font-size: 12.5px; }
    .refs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
    .nota { font-size: 12.5px; color: var(--alerta-texto); background: var(--alerta-fondo); border-left: 3px solid var(--oro); padding: 8px 12px; border-radius: 0 10px 10px 0; margin: 0 0 12px; }
    .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .campos label { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--tinta); }
    .campos input { font: inherit; font-size: 14px; color: var(--tinta); background: var(--campo); border: 1px solid var(--campo-borde); border-radius: 10px; padding: 8px 12px; text-align: right; font-family: var(--datos); }
    .campos input:focus { outline: none; border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184, 137, 58, 0.18); }
    .campos small { font-weight: 400; color: var(--tenue); }
    .guardar-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
    .estado-guardado { font-size: 12.5px; color: var(--tenue); }
    .vacio-grande { text-align: center; padding: 48px 20px; }
    .vacio-grande h2 { font-family: var(--titulos); color: var(--verde); font-weight: 600; letter-spacing: 0.06em; margin: 0 0 8px; }
    .vacio-grande p { color: var(--tenue); margin: 0 auto 18px; max-width: 520px; }
    .cargando { color: var(--tenue); padding: 30px 0; text-align: center; }
    /* Pestañas */
    .pestanas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding: 5px; border-radius: 14px; background: var(--pestanas-fondo); border: 1px solid var(--borde); width: fit-content; max-width: 100%; }
    .pestana { font: 600 14px/1 var(--texto); color: var(--tenue); background: none; border: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
    .pestana:hover { color: var(--verde); }
    .pestana.activa { color: var(--sobre-verde); background: linear-gradient(180deg, var(--boton-1), var(--boton-2)); box-shadow: 0 6px 14px -10px rgba(28, 74, 44, 0.9); }
    .pestana:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
    .pestanas.sub { margin: 0 0 14px; padding: 4px; background: var(--crema-clara); }
    .pestanas.sub .pestana { font-size: 13.5px; padding: 8px 12px; }
    .pestana .cuenta { display: inline-block; min-width: 20px; margin-left: 2px; padding: 1px 6px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--linea); color: var(--verde); }
    .pestana.activa .cuenta { background: rgba(255, 255, 255, 0.22); color: var(--sobre-verde); }
    /* Edición */
    .celda { font: inherit; font-size: 13.5px; color: var(--tinta); background: var(--campo); border: 1px solid var(--campo-borde); border-radius: 8px; padding: 6px 8px; width: 100%; min-width: 0; }
    .celda:focus { outline: none; border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184, 137, 58, 0.18); }
    .celda.num { text-align: right; font-family: var(--datos); min-width: 112px; }
    .celda.corto { width: 90px; margin-bottom: 4px; }
    .con-pct { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; width: 100%; }
    .con-pct .celda.pct { width: 96px; min-width: 0; }
    .con-pct span { color: var(--tenue); font-size: 13px; }
    .celda.calculado { background: rgba(47, 107, 66, 0.06); }
    td.unidad .celda + .celda, td select.celda + select.celda, td select.celda + input.celda { margin-top: 4px; }
    table.editable td { padding: 6px 6px; vertical-align: top; }
    textarea.celda { resize: vertical; line-height: 1.45; }
    .quitar { font: 700 16px/1 var(--texto); color: var(--tenue); background: none; border: 1px solid transparent; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; }
    .quitar:hover { color: var(--rojo); border-color: rgba(163, 50, 42, 0.3); background: rgba(163, 50, 42, 0.06); }
    .agregar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .boton.chico { font-size: 13px; padding: 8px 12px; }
    .liq li .celda.ancho { flex: 1; }
    .liq li .lado { display: flex; align-items: center; gap: 4px; }
    .recibo .boton { margin-top: 8px; }
    .recibo .firma-campo { margin-top: 12px; max-width: 320px; font-weight: 700; }
    .campos .valor { font-family: var(--datos); font-size: 15px; color: var(--verde); padding: 8px 0; }
    .meta { font-size: 12px; color: var(--tenue); margin-top: 18px; text-align: right; }

    /* ---------- Tablero ---------- */
    .kpi.alerta b { color: var(--rojo); }
    .kpi.alerta { border-color: rgba(163, 50, 42, 0.3); }
    .kpi.aviso b { color: var(--oro); }
    .kpi.baja span { color: var(--rojo); }
    .kpi.ok span { color: var(--verde-claro); }
    .link { font: inherit; font-weight: 700; color: var(--verde); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(28, 74, 44, 0.3); text-underline-offset: 3px; }
    .link:hover { color: var(--oro); }
    .link.rojo { color: var(--rojo); }
    .link:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; border-radius: 3px; }
    .lugar { padding: 12px 0; border-bottom: 1px solid var(--linea); }
    .lugar:first-of-type { padding-top: 0; }
    .lugar-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 14.5px; }
    .lugar-monto { font-family: var(--datos); font-size: 13.5px; color: var(--verde); }
    .barra-lugar { display: flex; gap: 2px; height: 12px; border-radius: 99px; overflow: hidden; background: rgba(28, 74, 44, 0.06); }
    .seg { display: inline-block; min-width: 6px; }
    .seg.transfiere { background: #5f9b6f; }
    .seg.efectivo { background: #d4b06a; }
    .seg.no-abono { background: var(--rojo); }
    .seg.desocupado { background: #c3c6bd; }
    .seg.atraso { background: #e08a3c; }
    .lugar-det { margin-top: 6px; font-size: 12.5px; color: var(--tenue); }
    .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--tenue); }
    .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
    .leyenda i.seg { width: 12px; height: 12px; min-width: 0; border-radius: 3px; }
    .ok-linea { color: var(--verde-claro); font-weight: 600; font-size: 14px; }
    .revisar { list-style: none; margin: 0; padding: 0; }
    .revisar li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 0 10px; padding: 9px 0 9px 12px; border-bottom: 1px solid var(--linea); border-left: 3px solid transparent; font-size: 13.5px; }
    .revisar li .quien { color: var(--tenue); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .revisar li .que { grid-column: 2; }
    .revisar li.rojo { border-left-color: var(--rojo); }
    .revisar li.rojo .que { color: var(--rojo); font-weight: 600; }
    .revisar li.oro { border-left-color: var(--oro); }
    .revisar li.azul { border-left-color: #6b86b8; }
    .revisar li.verde { border-left-color: var(--verde-claro); }

    /* ---------- Historial ---------- */
    table.historial { font-size: 12.5px; }

    .celda-mes { text-align: center; font-family: var(--datos); font-size: 11.5px; white-space: nowrap; border-radius: 6px; border: 2px solid var(--crema-clara); }
    .celda-mes.transfiere { background: rgba(95, 155, 111, 0.22); color: #24533a; }
    .celda-mes.efectivo { background: rgba(212, 176, 106, 0.3); color: #6b4e18; }
    .celda-mes.atraso { background: rgba(224, 138, 60, 0.3); color: #7a3f0c; }
    .celda-mes.no-abono { background: rgba(163, 50, 42, 0.16); color: var(--rojo); font-weight: 700; }
    .celda-mes.desocupado { background: rgba(109, 116, 105, 0.12); color: var(--tenue); }
    .celda-mes.vacia { background: transparent; }
    td.rojo { color: var(--rojo); font-weight: 700; }
    tr.fila-atraso td { background: rgba(224, 138, 60, 0.08); }

    /* Contratos (propiedades-contratos.js) */
    .contr-sub { display: block; font-size: 12px; color: var(--tenue); margin-top: 2px; }
    .lado { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    /* Unidades: toda la pantalla y la tabla más compacta, para que entren todas las columnas */
    body.ancho .pagina { width: 100%; padding-left: clamp(16px, 2vw, 32px); padding-right: clamp(16px, 2vw, 32px); }
    .tabla-scroll.fija table { font-size: 12.5px; }
    body.ancho .panel { padding: 16px 14px; }
    .tabla-scroll.fija th { padding: 8px 4px; font-size: 10.5px; letter-spacing: 0.02em; white-space: normal; vertical-align: bottom; line-height: 1.25; }
    .tabla-scroll.fija td { padding: 8px 4px; }
    .tabla-scroll.fija td.num, .tabla-scroll.fija th.num { font-family: var(--texto); font-variant-numeric: tabular-nums; }
    .tabla-scroll.fija td.unidad { min-width: 120px; max-width: 160px; }
    .tabla-scroll.fija td .sub { font-size: 11.5px; margin: 2px 0 0; }
    /* Unidades: encabezado y totales fijos al desplazar la tabla */
    .tabla-scroll.fija { max-height: min(70vh, 760px); overflow: auto; overscroll-behavior: contain; border-radius: 10px; }
    .tabla-scroll.fija thead th { position: sticky; top: 0; z-index: 2; background: var(--crema-clara); box-shadow: inset 0 -1px 0 var(--borde); border-bottom: 0; }

    th.valor-ini, td.valor-ini { border-left: 1px solid var(--borde); }
    td .rend { display: block; color: var(--verde); font-weight: 700; }

    .info { font: italic 700 12px/1 Georgia, "Times New Roman", serif; color: var(--verde); background: var(--campo); border: 1px solid rgba(28, 74, 44, 0.3);
      width: 20px; height: 20px; border-radius: 50%; margin-left: 8px; padding: 0; cursor: pointer; vertical-align: 1px; }

    dialog.ficha { width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 20px; border: 1px solid var(--borde); border-radius: 18px;
      background: var(--crema-clara); color: var(--tinta); font-family: var(--texto); box-shadow: 0 30px 60px -30px rgba(28, 74, 44, 0.6); }
    dialog.ficha::backdrop { background: rgba(36, 50, 42, 0.35); backdrop-filter: blur(2px); }
    .ficha-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
    .ficha-cab h3 { margin: 0; font-family: var(--titulos); font-weight: 600; font-size: 20px; letter-spacing: 0.06em; color: var(--verde); }
    .ficha h4 { margin: 14px 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--oro); }

    .ficha-campos select { font: inherit; font-size: 14px; color: var(--tinta); background: var(--campo); border: 1px solid var(--campo-borde); border-radius: 10px; padding: 8px 12px; }
    .ficha-campos select:focus { outline: none; border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184, 137, 58, 0.18); }
    .ficha-calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0 12px; }
    .ficha-calc .kpi { padding: 12px 14px; box-shadow: none; }
    .ficha-calc .kpi b { font-size: 18px; }
    .ficha-calc .kpi.ok b { color: var(--verde-claro); }
    .ficha-calc .kpi.baja b { color: var(--rojo); }
    .ficha-pie { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    .ficha .alerta { margin-top: 8px; }
    /* Contratos en dólares y cuadro de cuotas (propiedades-contratos.js) */

    table.cuotas { font-size: 12.5px; }
    table.cuotas th, table.cuotas td { padding: 5px 8px; }
    table.cuotas td.num, table.cuotas th.num { font-family: var(--texto); font-variant-numeric: tabular-nums; }
    table.cuotas tr.actual td { font-weight: 700; color: var(--verde); background: rgba(47, 107, 66, 0.08); }

    .cuotas-box .contr-sub { margin-top: 8px; }
    table.cuotas td.fact { text-align: center; }
    select.sel-fact { font: inherit; font-size: 12.5px; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--campo-borde); background: var(--campo); color: var(--tinta); }
    select.sel-fact.si { color: var(--verde-claro); border-color: rgba(47, 107, 66, 0.45); font-weight: 700; }
    select.sel-fact.no { color: var(--oro); border-color: rgba(168, 122, 47, 0.45); font-weight: 700; }
    table.cuotas td.cobrar { font-weight: 700; color: var(--verde); }
    table.cuotas td.cobrar .contr-sub { font-weight: 400; margin-top: 0; }
    table.cuotas td.vacio-cobrar { font-weight: 400; color: var(--tenue); font-size: 11.5px; }
    /* Rentabilidad */
    .rent-param { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: end; margin-bottom: 0; }
    .rent-param input { width: 100%; min-width: 0; }

    .pill.alquilar { color: var(--verde-claro); background: rgba(47, 107, 66, 0.12); }
    .pill.vender { color: var(--oro); background: rgba(217, 180, 106, 0.22); }
    td.rend-celda { color: var(--verde); font-weight: 700; }
  </style>
