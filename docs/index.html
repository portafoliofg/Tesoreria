<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Si se abre por http:// (un enlace o favorito viejo), pasa a https:// al instante. -->
  <script>if (location.protocol === "http:" && location.hostname !== "localhost") location.replace("https://" + location.host + location.pathname + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebe5dd">
  <link rel="icon" type="image/png" sizes="32x32" href="logo-as-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="logo-as-64.png">
  <link rel="apple-touch-icon" href="logo-as-180.png">
  <title>Andrés Sammartino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- La app y el ingreso hablan con Apps Script: la conexión se abre mientras carga la página. -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <!-- Las letras no frenan el dibujo de la página: se aplican cuando llegan. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700&display=swap"></noscript>
  <style>
    /* Paleta del logo de Andrés Sammartino: fondo crema, verde campo y dorado. */
    :root {
      --crema: #ebe5dd;
      --crema-clara: #f6f2ec;
      --verde: #1c4a2c;
      --verde-claro: #2f6b42;
      --oro: #b8893a;
      --oro-claro: #d9b46a;
      --tinta: #24322a;
      --tenue: #6d7469;
      --linea: rgba(28, 74, 44, 0.14);
      --titulos: "Cinzel", "Times New Roman", serif;
      --display: "Cormorant Garamond", Georgia, serif;
      --texto: "Manrope", "Segoe UI", system-ui, sans-serif;
      color-scheme: light;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--crema); }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #capa { position: fixed; inset: 0; z-index: 10; background: var(--crema); transition: opacity 0.7s ease, visibility 0.7s ease; }
    #capa.fuera { opacity: 0; visibility: hidden; }

    /* ---------- Presentación animada ----------
       El logo está separado en capas (lo verde, lo dorado, el nombre y el lema) para
       animarlo por partes: el anillo se dibuja desde arriba hacia los dos lados, pasa un
       brillo por lo dorado, aparecen el nombre y el lema, y al final el logo viaja hasta
       su lugar en el ingreso o el selector (sin corte). Centro del anillo: 49.4% 36.6%. */
    @property --barrido { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .intro { position: absolute; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }
    .intro .vc-saltar { pointer-events: auto; }
    .intro-luz {
      position: absolute; left: 50%; top: 46%; width: min(120vw, 1400px); aspect-ratio: 1; transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(217, 180, 106, 0.32), rgba(217, 180, 106, 0.08) 55%, transparent 72%);
      opacity: 0; transition: opacity 0.6s ease;
    }
    .intro-logo {
      position: absolute; left: 50%; top: 50%;
      width: min(88vw, calc(66vh * 928 / 700)); aspect-ratio: 928 / 700;
      transform: translate(-50%, -50%); transform-origin: 50% 50%;
    }
    .capa { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
    .capa.verde {
      -webkit-mask-image: conic-gradient(from 0deg at 49.4% 36.6%, transparent calc(360deg - var(--barrido)), #000 calc(374deg - var(--barrido)));
              mask-image: conic-gradient(from 0deg at 49.4% 36.6%, transparent calc(360deg - var(--barrido)), #000 calc(374deg - var(--barrido)));
    }
    .capa.oro {
      -webkit-mask-image: conic-gradient(from 0deg at 49.4% 36.6%, #000 calc(var(--barrido) - 14deg), transparent var(--barrido));
              mask-image: conic-gradient(from 0deg at 49.4% 36.6%, #000 calc(var(--barrido) - 14deg), transparent var(--barrido));
    }
    .capa.brillo {
      background: linear-gradient(105deg, transparent 42%, rgba(255, 246, 220, 0.95) 50%, transparent 58%) 100% 0 / 300% 100% no-repeat;
      mix-blend-mode: screen;
    }
    /* La máscara (y su imagen) solo si la presentación se va a ver. */
    .intro.con-imagenes .capa.brillo {
      -webkit-mask: url("intro-oro.webp?v=6") center / 100% 100% no-repeat;
              mask: url("intro-oro.webp?v=6") center / 100% 100% no-repeat;
    }
    .intro.anima .intro-luz { animation: luz 2.6s ease 1.1s both; }
    .intro.anima .capa.verde, .intro.anima .capa.oro { animation: dibujar 1.7s cubic-bezier(0.45, 0.05, 0.25, 1) 0.25s both; }
    .intro.anima .capa.brillo { animation: brillo 1.1s ease-in-out 1.95s both; }
    .intro.anima .capa.nombre { animation: nombre 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.85s both; }
    .intro.anima .capa.lema { animation: lema 0.7s ease 2.55s both; }
    @keyframes dibujar { 0% { --barrido: 0deg; opacity: 0; } 8% { opacity: 1; } 100% { --barrido: 374deg; opacity: 1; } }
    @keyframes brillo { 0% { opacity: 0; background-position: 100% 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; background-position: 0% 0; } }
    @keyframes nombre { from { opacity: 0; clip-path: inset(0 50% 0 50%); transform: translateY(6px); } to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
    @keyframes lema { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes luz { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 0.55; } }
    /* "Saltar" o menos movimiento: el logo completo, sin animación. */
    .intro.saltado .capa { animation: none !important; opacity: 1; -webkit-mask-image: none; mask-image: none; clip-path: none; transform: none; }
    .intro.saltado .capa.brillo { opacity: 0; }
    .vc-saltar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      font: 600 13px/1 var(--texto); color: var(--verde); cursor: pointer;
      padding: 10px 16px; border-radius: 999px; border: 1px solid var(--linea);
      background: rgba(255, 255, 255, 0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, background 0.2s ease;
    }
    .vc-saltar:hover { background: rgba(255, 255, 255, 0.85); }
    /* Al terminar: el logo viaja a su lugar; lo demás de la presentación se apaga. */
    #capa.eligiendo .vc-saltar, #capa.eligiendo .intro-luz { opacity: 0; pointer-events: none; animation: none; }
    .intro-logo.viajando { transition: transform 0.95s cubic-bezier(0.65, 0, 0.25, 1); }
    /* Mientras el logo de la presentación viaja, el del ingreso o selector espera oculto. */
    #capa.desde-intro .sel.visible .sel-logo { animation: none; opacity: 0; }
    #capa.desde-intro.logo-en-lugar .sel.visible .sel-logo { opacity: 1; }
    #capa.desde-intro .sel.visible .cartel { animation-delay: 0.55s; }
    #capa.desde-intro .sel.visible .cartel:nth-child(2) { animation-delay: 0.67s; }
    #capa.desde-intro .sel.visible .cartel:nth-child(3) { animation-delay: 0.79s; }
    #capa.desde-intro .sel.visible .acceso-form { animation-delay: 0.6s; }
    #capa.desde-intro .sel.visible .sel-pregunta, #capa.desde-intro .sel.visible .sel-usuario { animation: aparecer 0.6s ease 0.5s both; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ---------- Ingreso y selector ---------- */
    .sel {
      position: absolute; inset: 0; z-index: 5;
      display: grid; place-items: center; overflow-y: auto;
      padding-block: max(20px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      font-family: var(--texto); color: var(--tinta);
      background: radial-gradient(120% 90% at 50% 0%, var(--crema-clara), var(--crema) 60%);
      opacity: 0; transition: opacity 0.8s ease;
    }
    .sel[hidden] { display: none; }
    .sel.visible { opacity: 1; }
    .sel-caja { width: min(1080px, 100%); display: grid; justify-items: center; gap: clamp(14px, 3vh, 26px); text-align: center; }
    .sel-logo { display: block; width: auto; height: clamp(150px, 28vh, 250px); max-width: 100%; margin: 0 auto; }
    .sel.visible .sel-logo { animation: logo-entra 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) both; }
    @keyframes logo-entra { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
    .sel-pregunta { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(20px, 2.4vw, 24px); color: var(--verde); }
    .sel-usuario { margin: -6px 0 0; font-size: 13px; color: var(--tenue); }
    .sel-usuario button { font: inherit; font-weight: 600; color: var(--oro); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .sel-opciones { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.2vw, 22px); }
    @media (max-width: 900px) { .sel-opciones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .sel-opciones { grid-template-columns: minmax(0, 1fr); } }

    .cartel {
      position: relative; display: grid; gap: 8px; align-content: start; text-align: left; text-decoration: none;
      padding: clamp(18px, 2.6vw, 26px); border-radius: 18px; cursor: pointer;
      font: inherit; color: inherit;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--linea);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 18px 36px -24px rgba(28, 74, 44, 0.45);
      opacity: 0; transform: translateY(16px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .sel.visible .cartel { animation: cartel-entra 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s forwards; }
    .sel.visible .cartel:nth-child(2) { animation-delay: 0.27s; }
    .sel.visible .cartel:nth-child(3) { animation-delay: 0.39s; }
    @keyframes cartel-entra { to { opacity: 1; transform: none; } }
    .cartel:hover:not([aria-disabled="true"]), .cartel:focus-visible:not([aria-disabled="true"]) {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(184, 137, 58, 0.65);
      box-shadow: 0 0 0 1px rgba(184, 137, 58, 0.25), 0 24px 44px -24px rgba(28, 74, 44, 0.55);
      transform: translateY(-3px);
    }
    .cartel:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
    .cartel-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cartel-icono { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(47, 107, 66, 0.10), rgba(184, 137, 58, 0.10)); border: 1px solid var(--linea); }
    .cartel-icono svg { width: 28px; height: 28px; }
    .cartel-logo { width: 52px; height: 52px; filter: drop-shadow(0 6px 10px rgba(28, 40, 30, 0.25)); }
    .cartel h2 { margin: 6px 0 0; font-family: var(--titulos); font-weight: 600; font-size: clamp(20px, 2.2vw, 24px); letter-spacing: 0.06em; color: var(--verde); }
    .cartel p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--tenue); }
    .cartel-ir { margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--oro); }
    .cartel-ir::after { content: " →"; }
    .cartel[aria-disabled="true"] { cursor: default; }
    .cartel[aria-disabled="true"] h2, .cartel[aria-disabled="true"] .cartel-icono { opacity: 0.55; }
    .pronto { font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--oro); padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(184, 137, 58, 0.45); background: rgba(217, 180, 106, 0.12); }
    .pronto.avisa { animation: pronto-avisa 0.6s ease; }
    @keyframes pronto-avisa { 30% { transform: scale(1.08); background: rgba(217, 180, 106, 0.3); } }
    .cartel.abriendo .cartel-ir::after { content: ""; }

    .acceso-form {
      width: min(380px, 100%); display: grid; gap: 14px; text-align: left;
      padding: clamp(22px, 3vw, 30px); border-radius: 18px;
      background: rgba(255, 255, 255, 0.78); border: 1px solid var(--linea);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 22px 44px -26px rgba(28, 74, 44, 0.5);
      opacity: 0; transform: translateY(14px);
    }
    .sel.visible .acceso-form { animation: cartel-entra 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) 0.2s forwards; }
    .acceso-form h2 { margin: 0; font-family: var(--titulos); font-weight: 600; font-size: 20px; letter-spacing: 0.08em; color: var(--verde); text-align: center; }
    .acceso-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--tinta); }
    .acceso-form input {
      font: inherit; font-size: 15px; font-weight: 400; color: var(--tinta);
      padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(28, 74, 44, 0.22);
      background: #fffdfa; outline: none;
    }
    .acceso-form input:focus { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184, 137, 58, 0.18); }
    .acceso-boton {
      margin-top: 4px; font: 700 15px/1 var(--texto); letter-spacing: 0.04em; color: #fffaf0; cursor: pointer;
      padding: 13px 16px; border-radius: 12px; border: 0;
      background: linear-gradient(180deg, var(--verde-claro), var(--verde));
      box-shadow: 0 10px 22px -12px rgba(28, 74, 44, 0.8);
    }
    .acceso-boton:hover:not(:disabled) { filter: brightness(1.08); }
    .acceso-boton:disabled { opacity: 0.6; cursor: wait; }
    .acceso-boton:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
    .acceso-error { margin: 0; min-height: 1.4em; font-size: 13px; color: #a3322a; }
    .acceso-nota { margin: 0; font-size: 12.5px; color: var(--tenue); text-align: center; }
    /* Ingreso con Google (botón de Google Identity Services) y, debajo, usuario y clave como alternativa. */
    .acceso-google { display: flex; justify-content: center; min-height: 44px; transition: opacity 0.2s ease; }
    .acceso-google.esperando { opacity: 0.55; pointer-events: none; }
    .acceso-separador { display: flex; align-items: center; gap: 12px; margin: 2px 0 0; font-size: 12.5px; color: var(--tenue); }
    .acceso-separador::before, .acceso-separador::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
    .acceso-form:not(.con-google) .acceso-google, .acceso-form:not(.con-google) .acceso-separador { display: none; }
    .acceso-form.con-google .acceso-boton { color: var(--verde); background: transparent; border: 1px solid rgba(28, 74, 44, 0.32); box-shadow: none; }
    .acceso-form.con-google .acceso-boton:hover:not(:disabled) { filter: none; background: rgba(28, 74, 44, 0.05); }

    @media (max-height: 640px) { .sel-logo { height: clamp(110px, 24vh, 160px); } }
    @media (max-width: 600px) { .sel-logo { height: clamp(120px, 22vh, 180px); } }
    @media (prefers-reduced-motion: reduce) {
      .sel, .cartel, .acceso-form, .intro-logo.viajando { transition: none; }
      .sel.visible .cartel, .sel.visible .acceso-form, .sel.visible .sel-logo { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbzHN2YsUy94lXMT0RcSLfnuXQzx9j9ov4MleXNQhyPAKr7-tEwLIGEmnYcKaeA7pmh2IQ/exec"
          title="Tesorería · Andrés Sammartino"
          allow="clipboard-read; clipboard-write; camera; microphone"
          allowfullscreen></iframe>
  <div id="capa">
    <div class="intro" id="intro">
      <div class="intro-luz" aria-hidden="true"></div>
      <div class="intro-logo" id="introLogo" role="img" aria-label="Andrés Sammartino · Campos, bolsa de valores e inversiones inmobiliarias">
        <img class="capa verde" data-src="intro-verde.webp?v=6" alt="" width="928" height="700">
        <img class="capa oro" data-src="intro-oro.webp?v=6" alt="" width="928" height="700">
        <span class="capa brillo"></span>
        <img class="capa nombre" data-src="intro-nombre.webp?v=6" alt="" width="928" height="700">
        <img class="capa lema" data-src="intro-lema.webp?v=6" alt="" width="928" height="700">
      </div>
      <button type="button" class="vc-saltar" id="vcSaltar">Saltar</button>
    </div>

    <section class="sel" id="acceso" hidden aria-labelledby="accesoTitulo">
      <div class="sel-caja">
        <img class="sel-logo" src="marca.png?v=6" alt="Andrés Sammartino · Campos, bolsa de valores e inversiones inmobiliarias" width="928" height="700">
        <form class="acceso-form con-google" id="accesoForm" novalidate>
          <h2 id="accesoTitulo">Ingresar</h2>
          <div class="acceso-google" id="accesoGoogle"></div>
          <p class="acceso-separador">o con usuario y clave</p>
          <label>Usuario<input type="text" id="accesoUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
          <label>Contraseña<input type="password" id="accesoClave" autocomplete="current-password" required></label>
          <p class="acceso-error" id="accesoError" role="alert"></p>
          <button type="submit" class="acceso-boton" id="accesoBoton">Ingresar</button>
          <p class="acceso-nota">Un solo ingreso para todas las secciones.</p>
        </form>
      </div>
    </section>

    <section class="sel" id="sel" hidden aria-labelledby="selTitulo">
      <div class="sel-caja">
        <h1 style="margin:0"><img class="sel-logo" id="selTitulo" src="marca.png?v=6" alt="Andrés Sammartino · Campos, bolsa de valores e inversiones inmobiliarias" width="928" height="700"></h1>
        <p class="sel-pregunta">¿A dónde querés entrar?</p>
        <p class="sel-usuario" id="selUsuario" hidden></p>
        <div class="sel-opciones">
          <!-- Inversiones abre la plataforma de cartera (servidor propio en Render, con su propio ingreso).
               Si se ingresó con Google hace poco, le pasa la credencial en el #g= y no pide otro ingreso. -->
          <a class="cartel" id="irInversiones" href="https://azevo.onrender.com/">
            <span class="cartel-cabeza">
              <span class="cartel-icono" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 23 L10 15 L15 19 L25 7" stroke="#2f6b42" stroke-width="2.2"/>
                  <path d="M19 7 H25 V13" stroke="#b8893a" stroke-width="2.2"/>
                  <path d="M3 26 H25" stroke="#1c4a2c" stroke-opacity=".35" stroke-width="1.6"/>
                </svg>
              </span>
            </span>
            <h2>Inversiones</h2>
            <p>FCI, cheques en bolsa y rendimientos de cartera.</p>
            <span class="cartel-ir">Entrar</span>
          </a>
          <button type="button" class="cartel" id="irTesoreria">
            <span class="cartel-cabeza">
              <span class="cartel-icono" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 11 L14 5 L24 11" stroke="#b8893a" stroke-width="2.2"/>
                  <path d="M7 12 V21 M11.7 12 V21 M16.3 12 V21 M21 12 V21" stroke="#1c4a2c" stroke-width="2"/>
                  <path d="M4 24 H24" stroke="#b8893a" stroke-width="2.2"/>
                </svg>
              </span>
            </span>
            <h2>Tesorería</h2>
            <p>Cuentas, cheques, conciliaciones y flujo de fondos.</p>
            <span class="cartel-ir" id="tesIr">Entrar</span>
          </button>
          <!-- ?v=: subirlo al cambiar propiedades.html, así el navegador no usa una copia vieja. -->
          <a class="cartel" id="irPropiedades" href="propiedades.html?v=12">
            <span class="cartel-cabeza">
              <span class="cartel-icono" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 13 L14 5 L24 13" stroke="#b8893a" stroke-width="2.2"/>
                  <path d="M7 11 V24 H21 V11" stroke="#1c4a2c" stroke-width="2"/>
                  <path d="M12 24 V17 H16 V24" stroke="#b8893a" stroke-width="2"/>
                </svg>
              </span>
            </span>
            <h2>Propiedades</h2>
            <p>Inmuebles, alquileres, contratos y vencimientos.</p>
            <span class="cartel-ir">Entrar</span>
          </a>
        </div>
      </div>
    </section>
  </div>
  <script src="sesion.js?v=9"></script>
  <script>
    // Pantalla de inicio: la presentación animada del logo y, al terminar, el ingreso (si
    // no hay sesión) o el selector; el logo de la presentación viaja hasta su lugar en esa
    // pantalla. Hay un solo ingreso, con los usuarios de Tesorería (sesion.js). Tesorería
    // abre la app (que ya se viene cargando detrás) y recibe la sesión por postMessage;
    // Propiedades abre propiedades.html; Inversiones abre la plataforma de cartera (azevo.onrender.com).
    // El ingreso principal es con Google (cuentas de bgpsammar.com); usuario y clave quedan como alternativa.
    (function () {
      var capa = document.getElementById("capa");
      var app = document.getElementById("app");
      var intro = document.getElementById("intro");
      var introLogo = document.getElementById("introLogo");
      // Duración de la presentación hasta que el logo empieza a viajar (ver las animaciones en el CSS).
      var DURACION_INTRO = 3700;
      var relojIntro = 0;
      var sel = document.getElementById("sel");
      var acceso = document.getElementById("acceso");
      var btnTes = document.getElementById("irTesoreria");
      var appLista = false, eligio = false, cerrada = false, termino = false;
      var usuario = null;
      // Cliente OAuth de Google (el mismo que valida loginGoogle_ en src/Código.gs).
      var GOOGLE_CLIENT_ID = "852188026915-dlnsq9r0funnukkbhrng4gh0esg3g4ms.apps.googleusercontent.com";
      var URL_INVERSIONES = "https://azevo.onrender.com/";
      // La credencial de Google dura 1 hora: se le pasa a Inversiones solo si tiene menos de 50 minutos.
      var VIGENCIA_GOOGLE_MS = 50 * 60 * 1000;
      var formAcceso = document.getElementById("accesoForm");
      var cajaGoogle = document.getElementById("accesoGoogle");
      var googleListo = false, googleCargando = false, botonGoogle = false;

      // La sesión se confirma con el servidor durante la presentación. No se espera esa
      // respuesta para mostrar nada: con una sesión guardada aparece el selector al
      // instante, y solo si el servidor dice que venció se vuelve al ingreso.
      var consulta = BGPSesion.consultar();
      consulta.catch(function () {});
      // Sin sesión guardada se va a pedir el ingreso: la biblioteca de Google se carga durante la presentación.
      if (!BGPSesion.token()) cargarGoogle();

      // ----- Sesión hacia la app de Tesorería -----
      // La app está en un iframe de Google con otros iframes adentro: se manda a todos.
      function difundir(win, msg) {
        try { win.postMessage(msg, "*"); } catch (e) {}
        try { for (var i = 0; i < win.frames.length; i++) difundir(win.frames[i], msg); } catch (e) {}
      }
      function enviarSesion() {
        var t = BGPSesion.token();
        if (t && app.contentWindow) difundir(app.contentWindow, { tipo: "bgp-sesion", token: t });
      }
      window.addEventListener("message", function (e) {
        if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(e.origin) || !e.data) return;
        if (e.data.tipo === "bgp-pide-sesion" && BGPSesion.token()) {
          try { e.source.postMessage({ tipo: "bgp-sesion", token: BGPSesion.token() }, "*"); } catch (err) {}
        } else if (e.data.tipo === "bgp-inicio") {
          // "Volver al inicio" desde la app: el selector de secciones, sin cerrar la sesión.
          history.replaceState(null, "", "#elegir");
          location.reload();
        } else if (e.data.tipo === "bgp-salir") {
          // Salió desde la app: se cierra también acá y vuelve al ingreso.
          BGPSesion.salir().then(function () { history.replaceState(null, "", "#elegir"); location.reload(); });
        }
      });

      function cerrar() {
        if (cerrada) return;
        cerrada = true;
        capa.classList.add("fuera");
        setTimeout(function () { capa.remove(); }, 800);
      }

      function mostrar(seccion) {
        [sel, acceso].forEach(function (x) { if (x !== seccion) { x.hidden = true; x.classList.remove("visible"); } });
        capa.classList.add("eligiendo");
        seccion.hidden = false;
        void seccion.offsetWidth;
        seccion.classList.add("visible");
        if (intro.isConnected) llevarLogo(seccion);
      }

      // El logo de la presentación viaja (se mueve y se achica) hasta donde está el logo
      // de la pantalla que aparece; al llegar se cambia por ese y la presentación se quita.
      function llevarLogo(seccion) {
        var destino = seccion.querySelector(".sel-logo");
        capa.classList.add("desde-intro");
        intro.classList.add("saltado");
        var a = introLogo.getBoundingClientRect(), b = destino.getBoundingClientRect();
        var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
        var dy = (b.top + b.height / 2) - (a.top + a.height / 2);
        var escala = a.width ? b.width / a.width : 1;
        introLogo.classList.add("viajando");
        introLogo.style.transform = "translate(-50%, -50%) translate(" + dx + "px, " + dy + "px) scale(" + escala + ")";
        var listo = false;
        function llegar() {
          if (listo) return;
          listo = true;
          capa.classList.add("logo-en-lugar");
          intro.remove();
        }
        introLogo.addEventListener("transitionend", llegar);
        setTimeout(llegar, 1200);
      }

      function pintarUsuario() {
        var linea = document.getElementById("selUsuario");
        linea.replaceChildren();
        linea.hidden = !usuario;
        if (usuario) {
          var salir = document.createElement("button");
          salir.type = "button";
          salir.textContent = "Salir";
          salir.addEventListener("click", function () {
            try { if (googleListo) google.accounts.id.disableAutoSelect(); } catch (e) {}
            BGPSesion.salir().then(function () {
              difundir(app.contentWindow, { tipo: "bgp-salir" });
              usuario = null;
              mostrarAcceso("");
            });
          });
          var nombre = usuario.nombre || usuario.usuario;
          linea.append(nombre ? "Ingresaste como " + nombre + " · " : "", salir);
        }
      }

      function mostrarSelector() {
        pintarUsuario();
        mostrar(sel);
        setTimeout(function () { try { btnTes.focus({ preventScroll: true }); } catch (e) {} }, 400);
      }

      // ----- Ingreso con Google (Google Identity Services) -----
      // Si la biblioteca de Google no carga (red, bloqueador), queda solo usuario y clave.
      function sinGoogle() {
        googleCargando = false;
        formAcceso.classList.remove("con-google");
      }
      function cargarGoogle() {
        if (googleListo || googleCargando) return;
        if (window.google && google.accounts && google.accounts.id) { iniciarGoogle(); return; }
        googleCargando = true;
        var s = document.createElement("script");
        s.src = "https://accounts.google.com/gsi/client";
        s.async = true;
        s.onload = iniciarGoogle;
        s.onerror = sinGoogle;
        document.head.appendChild(s);
      }
      function iniciarGoogle() {
        googleCargando = false;
        if (!(window.google && google.accounts && google.accounts.id)) { sinGoogle(); return; }
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: alIngresarGoogle,
            hd: "bgpsammar.com",
            ux_mode: "popup",
            auto_select: false
          });
          googleListo = true;
        } catch (e) { sinGoogle(); return; }
        dibujarBotonGoogle();
      }
      // El botón se dibuja con el ingreso a la vista, para que tome el ancho del formulario.
      function dibujarBotonGoogle() {
        if (!googleListo || botonGoogle || acceso.hidden) return;
        try {
          google.accounts.id.renderButton(cajaGoogle, {
            type: "standard", theme: "outline", size: "large", shape: "rectangular",
            text: "signin_with", logo_alignment: "center", locale: "es-419",
            width: Math.max(200, Math.min(400, cajaGoogle.clientWidth || 320))
          });
          botonGoogle = true;
        } catch (e) { sinGoogle(); }
      }
      function alIngresarGoogle(resp) {
        var error = document.getElementById("accesoError");
        if (!resp || !resp.credential) { error.textContent = "No se pudo ingresar con Google. Probá de nuevo."; return; }
        error.textContent = "";
        cajaGoogle.classList.add("esperando");
        BGPSesion.ingresarGoogle(resp.credential).then(function (usr) {
          usuario = usr;
          enviarSesion();
          mostrarSelector();
        }, function (err) {
          error.textContent = err.message;
        }).then(function () {
          cajaGoogle.classList.remove("esperando");
        });
      }

      function mostrarAcceso(error) {
        document.getElementById("accesoError").textContent = error || "";
        document.getElementById("accesoClave").value = "";
        mostrar(acceso);
        cargarGoogle();
        dibujarBotonGoogle();
        // Con el botón de Google como ingreso principal no se enfoca el usuario (en el celular abriría el teclado).
        if (!formAcceso.classList.contains("con-google")) {
          setTimeout(function () { try { document.getElementById("accesoUsuario").focus({ preventScroll: true }); } catch (e) {} }, 400);
        }
      }

      // Al terminar la presentación (o saltearla): selector si hay sesión; si no, el ingreso.
      function alTerminar() {
        if (termino) return;
        termino = true;
        clearTimeout(relojIntro);
        usuario = BGPSesion.usuario();
        if (usuario) { enviarSesion(); mostrarSelector(); }
        else mostrarAcceso("");
        consulta.then(function (u) {
          if (u) {
            usuario = u;
            if (!sel.hidden) pintarUsuario();
          } else if (usuario && !BGPSesion.token() && !cerrada) {
            usuario = null;
            mostrarAcceso("Tu sesión venció. Volvé a ingresar.");
          }
        }, function () {});
      }

      document.getElementById("accesoForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var boton = document.getElementById("accesoBoton");
        var error = document.getElementById("accesoError");
        var u = document.getElementById("accesoUsuario").value.trim();
        var c = document.getElementById("accesoClave").value;
        if (!u || !c) { error.textContent = "Escribí tu usuario y tu contraseña."; return; }
        boton.disabled = true;
        boton.textContent = "Ingresando…";
        error.textContent = "";
        BGPSesion.ingresar(u, c).then(function (usr) {
          usuario = usr;
          enviarSesion();
          mostrarSelector();
        }, function (err) {
          error.textContent = err.message;
          document.getElementById("accesoClave").select();
        }).then(function () {
          boton.disabled = false;
          boton.textContent = "Ingresar";
        });
      });

      // Inversiones: con una credencial de Google reciente, la plataforma la lee del #g=, la
      // borra de la dirección y entra sin pedir otro ingreso. Si no hay, es el enlace común.
      // Se cambia el destino en el momento del clic (también sirve para abrir en otra pestaña).
      var irInversiones = document.getElementById("irInversiones");
      irInversiones.addEventListener("click", function () {
        var c = BGPSesion.credencialGoogle(VIGENCIA_GOOGLE_MS);
        irInversiones.href = c ? URL_INVERSIONES + "#g=" + encodeURIComponent(c) : URL_INVERSIONES;
        setTimeout(function () { irInversiones.href = URL_INVERSIONES; }, 0);
      });

      btnTes.addEventListener("click", function () {
        if (eligio) return;
        eligio = true;
        enviarSesion();
        if (appLista) { cerrar(); return; }
        btnTes.classList.add("abriendo");
        document.getElementById("tesIr").textContent = "Abriendo…";
        setTimeout(cerrar, 15000);
      });

      app.addEventListener("load", function () {
        appLista = true;
        // La app de Google tarda un poco más en armar sus iframes internos.
        enviarSesion();
        setTimeout(enviarSesion, 1500);
        if (eligio) cerrar();
      });

      // Volver con "atrás" después de salir (en Propiedades, por ejemplo): la página
      // vuelve de la memoria del navegador tal como estaba; se recarga para pedir el ingreso.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted && usuario && !BGPSesion.token()) { history.replaceState(null, "", "#elegir"); location.reload(); }
      });

      // La presentación se ve una sola vez: con la sesión guardada, si ya se vio en esta pestaña
      // o al volver desde Propiedades o al salir (index.html#elegir), el selector o el ingreso
      // aparecen al instante. Sus imágenes se bajan solo si se va a ver.
      var introVista = false;
      try { introVista = sessionStorage.getItem("bgp-intro") === "1"; sessionStorage.setItem("bgp-intro", "1"); } catch (e) {}
      if (location.hash === "#elegir" || BGPSesion.token() || introVista) {
        intro.remove();
        alTerminar();
        return;
      }
      Array.prototype.forEach.call(intro.querySelectorAll("img[data-src]"), function (im) { im.src = im.getAttribute("data-src"); });
      intro.classList.add("con-imagenes");

      document.getElementById("vcSaltar").addEventListener("click", alTerminar);

      // Con menos movimiento pedido por el sistema: el logo completo y enseguida a su lugar.
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        intro.classList.add("saltado");
        relojIntro = setTimeout(alTerminar, 600);
        return;
      }

      // Arranca cuando las capas del logo están listas (o a los 2,5 s, lo que pase antes),
      // así la animación no empieza con imágenes a medio cargar.
      var imagenes = Array.prototype.map.call(intro.querySelectorAll("img"), function (im) {
        return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
      });
      var arrancada = false;
      function arrancarIntro() {
        if (arrancada || termino) return;
        arrancada = true;
        intro.classList.add("anima");
        relojIntro = setTimeout(alTerminar, DURACION_INTRO);
      }
      Promise.all(imagenes).then(arrancarIntro);
      setTimeout(arrancarIntro, 2500);
    })();
  </script>
</body>
</html>
