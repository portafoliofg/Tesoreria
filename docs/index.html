<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Si se abre por http:// (un enlace o favorito viejo), pasa a https:// al instante. -->
  <script>if (location.protocol === "http:" && location.hostname !== "localhost") location.replace("https://" + location.host + location.pathname + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d1c">
  <link rel="icon" type="image/svg+xml" href="logo-tesoreria.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logo-tesoreria-32.png">
  <link rel="apple-touch-icon" href="logo-tesoreria-180.png">
  <title>B.G.P Sammar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;600;700&family=Marcellus&display=swap">
  <link rel="stylesheet" href="loader.css">
  <style>
    :root {
      --noche: #060d1c;
      --plata: #d3dbe6;
      --plata-clara: #eef2f7;
      --tenue: #9aa6b8;
      --verde: #2fd38a;
      --oro: #d8b36a;
      --display: "Marcellus", Georgia, serif;
      --texto: "Manrope", "Segoe UI", system-ui, sans-serif;
      --datos: "JetBrains Mono", ui-monospace, Menlo, monospace;
      color-scheme: dark;
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--noche); }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #capa { position: fixed; inset: 0; z-index: 10; transition: opacity 0.7s ease, visibility 0.7s ease; }
    #capa.fuera { opacity: 0; visibility: hidden; }

    /* ---------- Video de carga ---------- */
    .vc { position: absolute; inset: 0; overflow: hidden; background: var(--noche); font-family: var(--texto); color: var(--plata); }
    .vc::before { content: ""; position: absolute; inset: -40px; background: url("carga.jpg?v=4") center / cover; filter: blur(28px) brightness(0.45); }
    .vc video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    @media (max-aspect-ratio: 1/1) { .vc video { object-fit: contain; } }
    .sel-marca i { font-style: normal; color: var(--oro); }
    .vc-saltar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      font: 600 13px/1 var(--texto); color: var(--plata-clara); cursor: pointer;
      padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(6, 13, 28, 0.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
    }
    .vc-saltar:hover { background: rgba(6, 13, 28, 0.7); }
    #capa.eligiendo .vc-saltar { opacity: 0; pointer-events: none; }

    /* ---------- Selector sobre el último cuadro ---------- */
    .sel {
      position: absolute; inset: 0; z-index: 5;
      display: grid; place-items: center; overflow-y: auto;
      padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      font-family: var(--texto); color: var(--plata);
      background: radial-gradient(70% 60% at 50% 50%, rgba(6, 13, 28, 0.25), rgba(6, 13, 28, 0.7));
      -webkit-backdrop-filter: blur(0px) brightness(1); backdrop-filter: blur(0px) brightness(1);
      opacity: 0;
      transition: opacity 0.7s ease, backdrop-filter 1.2s ease, -webkit-backdrop-filter 1.2s ease;
    }
    .sel[hidden] { display: none; }
    .sel.con-fondo { background: linear-gradient(rgba(6, 13, 28, 0.45), rgba(6, 13, 28, 0.7)), url("carga-final.jpg?v=4") center / cover; }
    .sel.visible { opacity: 1; -webkit-backdrop-filter: blur(4px) brightness(0.72); backdrop-filter: blur(4px) brightness(0.72); }
    .sel-caja { width: min(1080px, 100%); display: grid; justify-items: center; gap: clamp(20px, 4vh, 34px); text-align: center; }
    .sel-marca { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5.6vw, 52px); letter-spacing: 0.2em; padding-left: 0.2em; line-height: 1; color: var(--plata-clara); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); white-space: nowrap; }
    .sel-sub { margin: 10px 0 0; font-size: clamp(10px, 1.5vw, 12.5px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--tenue); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
    .sel-pregunta { margin: 0; font-size: 15px; color: var(--plata); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
    .sel-opciones { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2.4vw, 24px); }
    @media (max-width: 900px) { .sel-opciones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .sel-opciones { grid-template-columns: minmax(0, 1fr); } .sel-marca { letter-spacing: 0.12em; padding-left: 0.12em; } }

    .cartel {
      text-decoration: none;
      position: relative; display: grid; gap: 10px; align-content: start; text-align: left;
      padding: clamp(20px, 3vw, 28px); border-radius: 20px; cursor: pointer;
      font: inherit; color: inherit;
      background: linear-gradient(150deg, rgba(30, 48, 82, 0.72), rgba(8, 16, 32, 0.78));
      border: 1px solid rgba(214, 226, 242, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 24px 44px -20px rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      opacity: 0; transform: translateY(18px) scale(0.98);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .sel.visible .cartel { animation: cartel-entra 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    .sel.visible .cartel:nth-child(2) { animation-delay: 0.12s; }
    .sel.visible .cartel:nth-child(3) { animation-delay: 0.24s; }
    @keyframes cartel-entra { to { opacity: 1; transform: none; } }
    .cartel:hover:not([aria-disabled="true"]), .cartel:focus-visible:not([aria-disabled="true"]) {
      border-color: rgba(216, 179, 106, 0.75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 0 1px rgba(216, 179, 106, 0.35), 0 28px 50px -20px rgba(0, 0, 0, 0.9);
      transform: translateY(-3px);
    }
    .cartel:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
    .cartel-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cartel-icono { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03)); border: 1px solid rgba(255, 255, 255, 0.14); }
    .cartel-icono svg { width: 28px; height: 28px; }
    .cartel-logo { width: 54px; height: 54px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .5)); }
    .cartel h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3vw, 30px); letter-spacing: 0.08em; color: var(--plata-clara); }
    .cartel p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--tenue); }
    .cartel-ir { margin-top: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--oro); }
    .cartel-ir::after { content: " →"; }
    .cartel[aria-disabled="true"] { cursor: default; }
    .cartel[aria-disabled="true"] h2, .cartel[aria-disabled="true"] .cartel-icono { opacity: 0.6; }
    .pronto { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--oro); padding: 6px 10px; border-radius: 99px; border: 1px solid rgba(216, 179, 106, 0.45); background: rgba(216, 179, 106, 0.08); }
    .pronto.avisa { animation: pronto-avisa 0.6s ease; }
    @keyframes pronto-avisa { 30% { transform: scale(1.08); background: rgba(216, 179, 106, 0.25); } }
    .cartel.abriendo .cartel-ir::after { content: ""; }

    /* ---------- Ingreso (mismos usuarios que Tesorería) ---------- */
    .acceso-form {
      width: min(380px, 100%); display: grid; gap: 14px; text-align: left;
      padding: clamp(22px, 3vw, 30px); border-radius: 20px;
      background: linear-gradient(150deg, rgba(30, 48, 82, 0.78), rgba(8, 16, 32, 0.84));
      border: 1px solid rgba(214, 226, 242, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 24px 44px -20px rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    .acceso-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--plata); }
    .acceso-form input {
      font: inherit; font-size: 15px; font-weight: 400; color: var(--plata-clara);
      padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(214, 226, 242, 0.22);
      background: rgba(6, 13, 28, 0.6); outline: none;
    }
    .acceso-form input:focus { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(216, 179, 106, 0.2); }
    .acceso-boton {
      margin-top: 4px; font: 700 15px/1 var(--texto); letter-spacing: 0.04em; color: #1a1406; cursor: pointer;
      padding: 13px 16px; border-radius: 12px; border: 0;
      background: linear-gradient(180deg, #e6c47f, var(--oro));
    }
    .acceso-boton:disabled { opacity: 0.6; cursor: wait; }
    .acceso-boton:focus-visible { outline: 2px solid var(--plata-clara); outline-offset: 3px; }
    .acceso-error { margin: 0; min-height: 1.4em; font-size: 13px; color: #f29b9b; }
    .acceso-nota { margin: 0; font-size: 12.5px; color: var(--tenue); }
    .sel-usuario { margin: 0; font-size: 13px; color: var(--tenue); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
    .sel-usuario button { font: inherit; color: var(--oro); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .sel, .cartel { transition: none; }
      .sel.visible .cartel { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbzHN2YsUy94lXMT0RcSLfnuXQzx9j9ov4MleXNQhyPAKr7-tEwLIGEmnYcKaeA7pmh2IQ/exec"
          title="Tesorería B.G.P Sammar"
          allow="clipboard-read; clipboard-write; camera"
          allowfullscreen></iframe>
  <div id="capa">
    <div class="vc" id="vc" aria-label="B.G.P Sammar">
      <video id="vcVideo" muted playsinline autoplay preload="auto" poster="carga.jpg?v=4">
        <source src="carga.webm?v=4" type="video/webm">
        <source src="carga.mp4?v=4" type="video/mp4">
      </video>
      <button type="button" class="vc-saltar" id="vcSaltar">Saltar</button>
    </div>

    <section class="sel" id="acceso" hidden aria-labelledby="accesoTitulo">
      <div class="sel-caja">
        <header>
          <h1 class="sel-marca" id="accesoTitulo">B<i>.</i>G<i>.</i>P SAMMAR</h1>
          <p class="sel-sub">Bolsas · Granos · Propiedades</p>
        </header>
        <form class="acceso-form" id="accesoForm" novalidate>
          <label>Usuario<input type="text" id="accesoUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
          <label>Contraseña<input type="password" id="accesoClave" autocomplete="current-password" required></label>
          <p class="acceso-error" id="accesoError" role="alert"></p>
          <button type="submit" class="acceso-boton" id="accesoBoton">Ingresar</button>
          <p class="acceso-nota">Usá tu usuario y contraseña de Tesorería.</p>
        </form>
      </div>
    </section>

    <section class="sel" id="sel" hidden aria-labelledby="selTitulo">
      <div class="sel-caja">
        <header>
          <h1 class="sel-marca" id="selTitulo">B<i>.</i>G<i>.</i>P SAMMAR</h1>
          <p class="sel-sub">Bolsas · Granos · Propiedades</p>
        </header>
        <p class="sel-pregunta">¿A dónde querés entrar?</p>
        <p class="sel-usuario" id="selUsuario" hidden></p>
        <div class="sel-opciones">
          <button type="button" class="cartel" id="irInversiones" aria-disabled="true" aria-describedby="invPronto">
            <span class="cartel-cabeza">
              <span class="cartel-icono" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 23 L10 15 L15 19 L25 7" stroke="#2fd38a" stroke-width="2.2"/>
                  <path d="M19 7 H25 V13" stroke="#2fd38a" stroke-width="2.2"/>
                  <path d="M3 26 H25" stroke="#d3dbe6" stroke-opacity=".5" stroke-width="1.6"/>
                </svg>
              </span>
              <span class="pronto" id="invPronto">Próximamente</span>
            </span>
            <h2>Inversiones</h2>
            <p>FCI, cheques en bolsa y rendimientos de cartera.</p>
          </button>
          <button type="button" class="cartel" id="irTesoreria">
            <span class="cartel-cabeza">
              <img class="cartel-logo" src="logo-tesoreria.svg" alt="" width="54" height="54">
            </span>
            <h2>Tesorería</h2>
            <p>Cuentas, cheques, conciliaciones y flujo de fondos.</p>
            <span class="cartel-ir" id="tesIr">Entrar</span>
          </button>
          <a class="cartel" id="irPropiedades" href="propiedades.html">
            <span class="cartel-cabeza">
              <span class="cartel-icono" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 13 L14 5 L24 13" stroke="#d8b36a" stroke-width="2.2"/>
                  <path d="M7 11 V24 H21 V11" stroke="#d3dbe6" stroke-width="2"/>
                  <path d="M12 24 V17 H16 V24" stroke="#d8b36a" stroke-width="2"/>
                </svg>
              </span>
            </span>
            <h2>Propiedades</h2>
            <p>Inmuebles, alquileres, contratos y vencimientos.</p>
            <span class="cartel-ir">Entrar</span>
          </a>
        </div>
      </div>
    </section>
  </div>
  <script src="loader.js"></script>
  <script src="sesion.js?v=2"></script>
  <script>
    // Pantalla de inicio: el video de 7 s y, al terminar, el ingreso (si no hay sesión)
    // y el selector sobre su último cuadro. El ingreso usa los mismos usuarios de
    // Tesorería (sesion.js). Tesorería abre la app (que ya se viene cargando detrás) y
    // recibe la sesión por postMessage; Propiedades abre propiedades.html; Inversiones
    // todavía no está disponible. Si el video no puede reproducirse, o el sistema pide
    // menos movimiento, se usa la animación de loader.js.
    (function () {
      var capa = document.getElementById("capa");
      var app = document.getElementById("app");
      var vc = document.getElementById("vc");
      var video = document.getElementById("vcVideo");
      var sel = document.getElementById("sel");
      var acceso = document.getElementById("acceso");
      var btnTes = document.getElementById("irTesoreria");
      var appLista = false, eligio = false, cerrada = false, arranco = false, termino = false, carga = null;
      var usuario = null;

      // La sesión se confirma con el servidor mientras corre el video. No se espera esa
      // respuesta para mostrar nada: con una sesión guardada aparece el selector al
      // instante, y solo si el servidor dice que venció se vuelve al ingreso.
      var consulta = BGPSesion.consultar();
      consulta.catch(function () {});

      // ----- Sesión hacia la app de Tesorería -----
      // La app está en un iframe de Google con otros iframes adentro: se manda a todos.
      function difundir(win, msg) {
        try { win.postMessage(msg, "*"); } catch (e) {}
        try { for (var i = 0; i < win.frames.length; i++) difundir(win.frames[i], msg); } catch (e) {}
      }
      function enviarSesion() {
        var t = BGPSesion.token();
        if (t && app.contentWindow) difundir(app.contentWindow, { tipo: "bgp-sesion", token: t });
      }
      window.addEventListener("message", function (e) {
        if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(e.origin) || !e.data) return;
        if (e.data.tipo === "bgp-pide-sesion" && BGPSesion.token()) {
          try { e.source.postMessage({ tipo: "bgp-sesion", token: BGPSesion.token() }, "*"); } catch (err) {}
        } else if (e.data.tipo === "bgp-salir") {
          // Salió desde la app: se cierra también acá y vuelve al ingreso.
          BGPSesion.salir().then(function () { history.replaceState(null, "", "#elegir"); location.reload(); });
        }
      });

      function cerrar() {
        if (cerrada) return;
        cerrada = true;
        capa.classList.add("fuera");
        setTimeout(function () { if (carga) carga.destroy(); video.pause(); capa.remove(); }, 800);
      }

      function mostrar(seccion) {
        [sel, acceso].forEach(function (x) { if (x !== seccion) { x.hidden = true; x.classList.remove("visible"); } });
        if (!vc.isConnected) seccion.classList.add("con-fondo");
        capa.classList.add("eligiendo");
        seccion.hidden = false;
        void seccion.offsetWidth;
        seccion.classList.add("visible");
      }

      function pintarUsuario() {
        var linea = document.getElementById("selUsuario");
        linea.replaceChildren();
        linea.hidden = !usuario;
        if (usuario) {
          var salir = document.createElement("button");
          salir.type = "button";
          salir.textContent = "Salir";
          salir.addEventListener("click", function () {
            BGPSesion.salir().then(function () {
              difundir(app.contentWindow, { tipo: "bgp-salir" });
              usuario = null;
              mostrarAcceso("");
            });
          });
          var nombre = usuario.nombre || usuario.usuario;
          linea.append(nombre ? "Ingresaste como " + nombre + " · " : "", salir);
        }
      }

      function mostrarSelector() {
        pintarUsuario();
        mostrar(sel);
        setTimeout(function () { try { btnTes.focus({ preventScroll: true }); } catch (e) {} }, 400);
      }

      function mostrarAcceso(error) {
        document.getElementById("accesoError").textContent = error || "";
        document.getElementById("accesoClave").value = "";
        mostrar(acceso);
        setTimeout(function () { try { document.getElementById("accesoUsuario").focus({ preventScroll: true }); } catch (e) {} }, 400);
      }

      // Al terminar el video (o saltearlo): selector si hay sesión; si no, el ingreso.
      function alTerminar() {
        if (termino) return;
        termino = true;
        video.pause();
        usuario = BGPSesion.usuario();
        if (usuario) { enviarSesion(); mostrarSelector(); }
        else mostrarAcceso("");
        consulta.then(function (u) {
          if (u) {
            usuario = u;
            if (!sel.hidden) pintarUsuario();
          } else if (usuario && !BGPSesion.token() && !cerrada) {
            usuario = null;
            mostrarAcceso("Tu sesión venció. Volvé a ingresar.");
          }
        }, function () {});
      }

      document.getElementById("accesoForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var boton = document.getElementById("accesoBoton");
        var error = document.getElementById("accesoError");
        var u = document.getElementById("accesoUsuario").value.trim();
        var c = document.getElementById("accesoClave").value;
        if (!u || !c) { error.textContent = "Escribí tu usuario y tu contraseña."; return; }
        boton.disabled = true;
        boton.textContent = "Ingresando…";
        error.textContent = "";
        BGPSesion.ingresar(u, c).then(function (usr) {
          usuario = usr;
          enviarSesion();
          mostrarSelector();
        }, function (err) {
          error.textContent = err.message;
          document.getElementById("accesoClave").select();
        }).then(function () {
          boton.disabled = false;
          boton.textContent = "Ingresar";
        });
      });

      btnTes.addEventListener("click", function () {
        if (eligio) return;
        eligio = true;
        enviarSesion();
        if (appLista) { cerrar(); return; }
        btnTes.classList.add("abriendo");
        document.getElementById("tesIr").textContent = "Abriendo…";
        setTimeout(cerrar, 15000);
      });
      document.getElementById("irInversiones").addEventListener("click", function () {
        var p = document.getElementById("invPronto");
        p.classList.remove("avisa");
        void p.offsetWidth;
        p.classList.add("avisa");
      });

      app.addEventListener("load", function () {
        appLista = true;
        // La app de Google tarda un poco más en armar sus iframes internos.
        enviarSesion();
        setTimeout(enviarSesion, 1500);
        if (eligio) cerrar();
      });

      function usarAnimacion() {
        if (carga || cerrada || termino) return;
        video.pause();
        vc.remove();
        try {
          carga = BGPLoader.create(capa, { duracion: 7000, alTerminar: alTerminar });
        } catch (e) {
          alTerminar();
        }
      }

      // Volver con "atrás" después de salir (en Propiedades, por ejemplo): la página
      // vuelve de la memoria del navegador tal como estaba; se recarga para pedir el ingreso.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted && usuario && !BGPSesion.token()) { history.replaceState(null, "", "#elegir"); location.reload(); }
      });

      // Al volver desde Propiedades o al salir (index.html#elegir) no se repite el video.
      if (location.hash === "#elegir") {
        video.pause();
        vc.remove();
        alTerminar();
        return;
      }

      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        usarAnimacion();
        return;
      }

      video.addEventListener("playing", function () { arranco = true; });
      if (!video.paused && video.currentTime > 0) arranco = true;
      // Al terminar, el video queda quieto en su último cuadro, detrás del ingreso o el selector.
      video.addEventListener("ended", alTerminar);
      video.addEventListener("error", usarAnimacion);
      video.querySelector('source[type="video/mp4"]').addEventListener("error", usarAnimacion);
      document.getElementById("vcSaltar").addEventListener("click", function () {
        video.pause();
        if (video.duration) video.currentTime = Math.max(0, video.duration - 0.05);
        alTerminar();
      });

      var intento = video.play();
      if (intento && intento.catch) intento.catch(usarAnimacion);
      // Si en 3 s el video no arrancó (conexión lenta, ahorro de batería), va la animación.
      setTimeout(function () {
        if (!arranco && !video.paused && video.currentTime > 0) arranco = true;
        if (!arranco) usarAnimacion();
      }, 3000);
    })();
  </script>
</body>
</html>
